<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Me · mindset</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="me" data-title="me.title">
  <main class="page">
    <h1 data-i18n="me.title">Me</h1>
    <p id="page-status" class="status" hidden></p>

    <section id="signed-out" class="panel" hidden>
      <p class="lead" data-i18n="error.login_required">Sign in to continue.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/login" data-i18n="auth.submitLogin">Sign in</a>
        <a class="btn btn-ghost" href="/register" data-i18n="auth.submitRegister">Create account</a>
      </div>
    </section>

    <section id="empty" class="panel" hidden>
      <p class="lead" data-i18n="me.empty">You don't have a mindset yet.</p>
      <a class="btn btn-primary" href="/new" data-i18n="home.write">Write yours</a>
    </section>

    <section id="owner" hidden>
      <div class="profile-head">
        <div id="avatar"></div>
        <div class="profile-id">
          <h2 id="title" class="h1">mindset</h2>
          <p id="meta" class="meta"></p>
        </div>
      </div>
      <div class="actions">
        <a id="profile-link" class="btn btn-ghost" href="/" data-i18n="me.view">View profile</a>
        <a class="btn btn-ghost" href="/new" data-i18n="me.edit">Edit</a>
        <button type="button" id="toggle-publish" class="btn btn-ghost"></button>
      </div>
      <p id="summary" class="summary"></p>
      <div id="radar"></div>
      <div id="open-bars" class="panel"></div>
      <section class="panel panel-private">
        <h2 data-i18n="create.privateTitle">Only for you</h2>
        <div id="closed-bars"></div>
        <h3 data-i18n="me.closedTexts">Closed texts</h3>
        <div id="closed-texts" class="posts"></div>
      </section>

      <section class="panel" id="alias-panel">
        <h2 data-i18n="me.aliasTitle">Alias</h2>
        <p class="hint" data-i18n="me.aliasHint">Optional. 3-20 lowercase letters, digits or _. Your tribe always sees it.</p>
        <form id="alias-form" class="alias-form" novalidate>
          <label class="field"><span class="prefix-input"><span>@</span><input id="alias" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" maxlength="20" pattern="[a-z0-9_]{3,20}" /></span></label>
          <fieldset class="choices">
            <label><input type="radio" name="visibility" value="tribe" checked /> <span data-i18n="me.aliasTribe">Only my tribe</span></label>
            <label><input type="radio" name="visibility" value="public" /> <span data-i18n="me.aliasPublic">Everyone can see it</span></label>
          </fieldset>
          <div class="actions">
            <button type="submit" class="btn btn-primary" data-i18n="me.aliasSave">Save alias</button>
            <button type="button" id="alias-remove" class="btn btn-ghost" hidden data-i18n="me.aliasRemove">Remove alias</button>
          </div>
          <p id="alias-status" class="status" hidden></p>
        </form>
      </section>
    </section>

    <section id="account" class="panel" hidden>
      <h2 data-i18n="me.account">Account</h2>
      <p id="email" class="meta"></p>
      <div class="actions">
        <button type="button" id="sign-out" class="btn btn-ghost" data-i18n="me.signOut">Sign out</button>
        <button type="button" id="delete" class="btn btn-ghost btn-danger-text" hidden data-i18n="me.deleteMindset">Delete mindset</button>
        <button type="button" id="delete-account" class="btn btn-ghost btn-danger-text" data-i18n="me.deleteAccount">Delete account</button>
      </div>
    </section>
  </main>

  <dialog id="delete-dialog" class="modal">
    <form method="dialog">
      <h2 id="delete-title"></h2>
      <p id="delete-copy"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-danger" value="confirm" data-i18n="me.delete">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/me.js" defer></script>
</body>
</html>
