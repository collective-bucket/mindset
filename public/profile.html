<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>mindset</title>
  <meta name="description" content="A public mindset profile." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="">
  <main class="page">
    <p id="page-status" class="status" hidden></p>

    <section id="profile" class="profile" hidden>
      <div class="profile-head">
        <div id="avatar"></div>
        <div class="profile-id">
          <h1 id="title">mindset</h1>
          <p id="alias" class="alias" hidden></p>
        </div>
      </div>
      <div id="badges" class="badges"></div>
      <p id="summary" class="summary"></p>
      <p id="meta" class="meta"></p>

      <div class="profile-actions">
        <button type="button" id="follow" class="btn btn-primary" hidden data-i18n="profile.follow">Follow</button>
        <button type="button" id="tribe" class="btn btn-ghost" hidden data-i18n="profile.addTribe">Add to tribe</button>
        <button type="button" id="share" class="btn btn-ghost" data-i18n="profile.share">Share</button>
        <a id="edit" class="btn btn-ghost" href="/new" hidden data-i18n="profile.edit">Edit</a>
        <a id="manage" class="btn btn-ghost" href="/me" hidden data-i18n="profile.manage">Manage</a>
      </div>
      <p id="action-status" class="status" hidden></p>

      <div id="radar"></div>
      <div id="bars" class="panel"></div>
      <div id="texts" class="posts"></div>
      <p class="fineprint" data-i18n="common.notTest">This is not a test result. It's an approximate reading.</p>
    </section>

    <section id="similar-section" class="section" hidden>
      <h2 data-i18n="profile.similar">Similar mindsets</h2>
      <div id="similar" class="feed"></div>
    </section>
  </main>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/profile.js" defer></script>
</body>
</html>
