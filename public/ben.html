<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benimki | Mindset</title>
  <meta name="description" content="Kendi mindsetin, açık ve kapalı okumaların." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header">
    <nav data-cb-shell-nav>
      <a href="/liste">Liste</a>
      <a href="/ben">Benimki</a>
    </nav>
    <div data-cb-shell-cta>
      <a class="btn btn-primary" href="/yeni">Yaz</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1 id="title">Benimki</h1>
      <p id="login-hint" hidden><a id="login-link" class="btn btn-primary" href="#">Giriş yap</a></p>
      <p id="empty" hidden>Henüz bir numaran yok. <a href="/yeni">Yaz</a>.</p>
      <div id="owner" hidden>
        <p id="meta" class="meta"></p>
        <p id="summary" class="summary"></p>
        <div id="radar"></div>
        <div id="open-bars"></div>
        <div id="open-texts"></div>
        <h2>Yalnız sana</h2>
        <div id="closed-bars"></div>
        <div id="closed-texts"></div>
        <div class="actions">
          <a class="btn btn-primary" href="/yeni">Yeniden oku</a>
          <a id="profile-link" class="btn btn-ghost" href="/m/0">Profil</a>
          <button type="button" id="toggle-publish" class="btn btn-ghost">Yayından kaldır</button>
          <button type="button" id="delete" class="btn btn-danger">Sil</button>
        </div>
      </div>
      <p id="page-status" class="status" hidden></p>
    </div>
  </main>

  <dialog id="delete-dialog" class="modal">
    <form method="dialog">
      <h2>Sil</h2>
      <p id="delete-copy"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Vazgeç</button>
        <button class="btn btn-danger" value="confirm">Sil</button>
      </div>
    </form>
  </dialog>

  <footer data-cb-shell="footer"></footer>
  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/lens-v1.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/mine.js" defer></script>
</body>
</html>
