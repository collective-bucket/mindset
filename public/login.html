<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eafbf5" />
  <title>sign in · Mindset Bucket</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=mvjt425z" />
  <link rel="stylesheet" href="/assets/styles.css?v=mvjt425z" />
</head>
<body data-tab="" data-page="login" data-title="auth.loginTitle">
  <main class="page page-narrow">
    <div class="head">
      <a class="head-back" href="#" data-i18n-aria="common.back" aria-label="Back"><svg viewBox="0 0 8 16" aria-hidden="true"><path d="M7 1 1 8l6 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="head-main">
        <h1 data-i18n="auth.loginTitle">Sign in</h1>
        <p class="head-meta" data-i18n="auth.loginLead">Welcome back to the lake.</p>
      </div>
    </div>
    <form id="auth-form" class="auth-form" novalidate>
      <button type="button" id="google" class="btn btn-ghost btn-block btn-google"><span class="g" aria-hidden="true">G</span><span data-i18n="auth.google">Continue with Google</span></button>
      <p class="landing-or" data-i18n="auth.or">or</p>
      <label class="field"><span data-i18n="auth.email">Email</span><input id="email" type="email" autocomplete="email" required /></label>
      <label class="field"><span data-i18n="auth.password">Password</span><input id="password" type="password" autocomplete="current-password" required minlength="6" /></label>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.submitLogin">Sign in</button>
    </form>
    <p id="auth-status" class="status" role="status" hidden></p>
    <p class="auth-links">
      <a href="/forgot" data-keep-next data-i18n="auth.toForgot">Forgot password?</a>
      <a href="/register" data-keep-next data-i18n="auth.toRegister">New here? Create an account</a>
    </p>
  </main>

  <script src="/assets/config.js?v=mvjt425z" defer></script>
  <script src="/assets/i18n.js?v=mvjt425z" defer></script>
  <script src="/assets/demographics.js?v=mvjt425z" defer></script>
  <script src="/assets/lens-v2.js?v=mvjt425z" defer></script>
  <script src="/assets/reading.js?v=mvjt425z" defer></script>
  <script src="/assets/firestore.js?v=mvjt425z" defer></script>
  <script type="module" src="/assets/auth.js?v=mvjt425z"></script>
  <script src="/assets/store.js?v=mvjt425z" defer></script>
  <script src="/assets/social.js?v=mvjt425z" defer></script>
  <script src="/assets/notices.js?v=mvjt425z" defer></script>
  <script src="/assets/ui.js?v=mvjt425z" defer></script>
  <script src="/assets/account.js?v=mvjt425z" defer></script>
</body>
</html>
