<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liste | Mindset</title>
  <meta name="description" content="Açık mindset okumalarını süz." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header">
    <nav data-cb-shell-nav>
      <a href="/liste">Liste</a>
      <a href="/ben">Benimki</a>
    </nav>
    <div data-cb-shell-cta>
      <a class="btn btn-primary" href="/yeni">Yaz</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Liste</h1>
      <p class="lead">Dört açık okumadan birine göre süzülür. En fazla 24 mindset. Kapalı okumalar burada yok.</p>
      <form id="filter" class="filter">
        <label>Okuma
          <select id="axis" name="axis">
            <option value="">Tümü</option>
          </select>
        </label>
        <label>En az
          <select id="min" name="min" disabled>
            <option value="0">0</option>
            <option value="20">20</option>
            <option value="40">40</option>
            <option value="60" selected>60</option>
            <option value="80">80</option>
          </select>
        </label>
      </form>
      <h2>Dağılım</h2>
      <div id="histogram" class="hist-grid"></div>
      <h2>Mindsetler</h2>
      <div id="results"></div>
      <p id="page-status" class="status" hidden></p>
    </div>
  </main>

  <footer data-cb-shell="footer"></footer>
  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/lens-v1.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/list.js" defer></script>
</body>
</html>
