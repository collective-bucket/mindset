<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Explore · mindset</title>
  <meta name="description" content="Filter published mindsets by reading, age, gender and country." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="explore" data-title="explore.title">
  <main class="page">
    <h1 data-i18n="explore.title">Explore</h1>

    <form class="filters" id="filters">
      <label><span data-i18n="explore.axis">Reading</span><select id="axis"><option value="" data-i18n="explore.newest">Newest</option></select></label>
      <label><span data-i18n="explore.min">At least</span>
        <select id="min">
          <option value="0">0</option>
          <option value="20">20</option>
          <option value="40">40</option>
          <option value="60">60</option>
          <option value="80">80</option>
        </select>
      </label>
      <label><span data-i18n="explore.slice">Group</span>
        <select id="slice">
          <option value="" data-i18n="explore.everyone">Everyone</option>
          <option value="ageBand" data-i18n="demo.age">Age range</option>
          <option value="gender" data-i18n="demo.gender">Gender</option>
          <option value="country" data-i18n="demo.country">Country</option>
        </select>
      </label>
      <label><span data-i18n="explore.value">Value</span><select id="slice-value" disabled></select></label>
    </form>

    <section class="panel">
      <h2 data-i18n="explore.charts">Distribution</h2>
      <p id="total" class="meta"></p>
      <div id="axis-chart" class="hist-grid"></div>
      <div class="chart-grid">
        <div><h3 data-i18n="explore.byAge">By age</h3><div id="age-chart"></div></div>
        <div><h3 data-i18n="explore.byGender">By gender</h3><div id="gender-chart"></div></div>
        <div><h3 data-i18n="explore.byCountry">Top countries</h3><div id="country-chart"></div></div>
        <div><h3 data-i18n="explore.byCity">Top cities</h3><div id="city-chart"></div></div>
      </div>
      <p class="fineprint" data-i18n="explore.cityNote">Cities with fewer than 5 people are hidden.</p>
    </section>

    <h2 data-i18n="explore.results">Mindsets</h2>
    <p id="page-status" class="status" hidden></p>
    <div id="results" class="feed"></div>
  </main>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/explore.js" defer></script>
</body>
</html>
