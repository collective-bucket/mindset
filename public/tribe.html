<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Tribe · mindset</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="tribe" data-title="tribe.title">
  <main class="page">
    <div class="page-head">
      <h1 data-i18n="tribe.title">Tribe</h1>
      <a class="btn btn-ghost btn-small" href="/following" data-i18n="tribe.followingLink">Following</a>
    </div>
    <p class="lead" data-i18n="tribe.lead">A tribe is mutual: you invite, they accept. Following needs no approval.</p>
    <p id="page-status" class="status" hidden></p>
    <p id="login-hint" hidden><a id="login-link" class="btn btn-primary" href="/login" data-i18n="top.signIn">Sign in</a></p>

    <div id="tribe-body" hidden>
      <section class="section">
        <h2 data-i18n="tribe.incoming">Requests</h2>
        <div id="incoming" class="list"></div>
      </section>
      <section class="section">
        <h2 data-i18n="tribe.members">Members</h2>
        <div id="members" class="list"></div>
      </section>
      <section class="section">
        <h2 data-i18n="tribe.outgoing">Sent</h2>
        <div id="outgoing" class="list"></div>
      </section>
    </div>
  </main>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/tribe.js" defer></script>
</body>
</html>
