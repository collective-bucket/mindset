<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eafbf5" />
  <title>lake · Mindset Bucket</title>
  <meta name="description" content="Minds swim in a lake. Narrow the scale, find yours, swim after them." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="lake" data-title="lake.title">
  <main class="page page-lake">
    <section id="auth-wall" class="section auth-wall" hidden></section>

    <div id="gated" hidden>
    <div class="head">
      <div>
        <h1 class="visually-hidden" data-i18n="lake.title">Lake</h1>
        <p class="hint" data-i18n="lake.lead">Every fish is a mind. Narrow the scale and swim after the ones you want to follow.</p>
      </div>
      <span id="lake-count" class="head-side" aria-live="polite"></span>
    </div>
    <p id="page-status" class="status" role="status" hidden></p>

    <div class="lake-wrap">
      <span class="lake-label lake-label-top" id="y-high"></span>
      <div class="lake" id="lake"></div>
      <span class="lake-label lake-label-bottom" id="y-low"></span>
      <div class="lake-x"><span id="x-low"></span><span id="x-high"></span></div>
      <div class="lake-tools">
        <button type="button" id="zoom-reset" class="btn btn-small" data-i18n="lake.wholeLake">Whole lake</button>
        <button type="button" id="view-toggle" class="btn btn-small" aria-pressed="false" data-i18n="lake.asList">Show as list</button>
      </div>
    </div>
    <div id="fish-list" class="feed" hidden></div>

    <section class="panel" id="panel">
      <button type="button" id="panel-toggle" class="panel-handle" aria-expanded="false" aria-controls="panel-body">
        <span data-i18n="lake.narrow">Narrow the scale</span>
        <span id="panel-summary" class="hint"></span>
      </button>
      <div id="panel-body" hidden>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-filter" aria-selected="true" aria-controls="filter-pane" data-i18n="lake.filter">Filter</button>
          <button type="button" role="tab" id="tab-bucket" aria-selected="false" aria-controls="bucket-pane" data-i18n="lake.bucket">Bucket</button>
        </div>

        <div id="filter-pane" role="tabpanel" aria-labelledby="tab-filter">
          <div class="demo-grid">
            <label class="field"><span data-i18n="lake.across">Across</span><select id="axis-x"></select></label>
            <label class="field"><span data-i18n="lake.up">Up</span><select id="axis-y"></select></label>
          </div>
          <div id="ranges"></div>
          <div class="demo-grid">
            <label class="field"><span data-i18n="demo.age">Age range</span><select id="f-ageBand"></select></label>
            <label class="field"><span data-i18n="demo.gender">Gender</span><select id="f-gender"></select></label>
            <label class="field"><span data-i18n="demo.country">Country</span><select id="f-country"></select></label>
          </div>
          <label class="check"><input type="checkbox" id="f-uncaught" /> <span data-i18n="lake.untrailed">Only fish not on my trail</span></label>
                    <div class="actions"><button type="button" id="f-clear" class="btn btn-small" data-i18n="lake.clear">Clear</button></div>
        </div>

        <div id="bucket-pane" role="tabpanel" aria-labelledby="tab-bucket" hidden>
          <p class="hint" data-i18n="lake.bucketLead">The whole bucket, counted. Nobody is identifiable here.</p>
          <p id="total" class="meta"></p>
          <div id="axis-chart" class="hist-grid"></div>
          <h3 data-i18n="explore.byAge">By age</h3>
          <div id="age-chart"></div>
          <h3 data-i18n="explore.byGender">By gender</h3>
          <div id="gender-chart"></div>
          <h3 data-i18n="explore.byCountry">Top countries</h3>
          <div id="country-chart"></div>
          <h3 data-i18n="explore.byCity">Top cities</h3>
          <div id="city-chart"></div>
          <p class="hint" data-i18n="explore.cityNote">Places with fewer than 5 people are hidden.</p>
        </div>
      </div>
    </section>
    </div>
  </main>

  <dialog id="fish-card" class="modal modal-sheet" aria-labelledby="card-number">
    <div class="head">
      <div>
        <p class="eyebrow" data-i18n="profile.fish">Fish</p>
        <h2 id="card-number" class="number"></h2>
        <p id="card-headline" class="entry-headline" hidden></p>
        <p id="card-alias" class="alias" hidden></p>
      </div>
      <button type="button" id="card-close" class="btn btn-small" data-i18n="common.close">Close</button>
    </div>
    <p id="card-badges" class="meta"></p>
    <p id="card-summary" class="summary"></p>
    <p id="card-quote" class="quote"></p>
    <div class="actions">
      <button type="button" id="card-tail" class="btn btn-primary" aria-pressed="false" data-i18n="profile.tail">Swim after</button>
      <a id="card-view" class="btn" href="/" data-i18n="lake.view">View</a>
    </div>
    <p id="card-status" class="status" role="status" hidden></p>
  </dialog>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/lake.js" defer></script>
</body>
</html>
