<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Create account · mindset</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-tab="me" data-page="register" data-title="auth.registerTitle">
  <main class="page page-narrow">
    <h1 data-i18n="auth.registerTitle">Create account</h1>
    <form id="auth-form" class="auth-form" novalidate>
      <label class="check"><input id="adult" type="checkbox" required /> <span data-i18n="auth.adult">I am 18 or older.</span></label>
      <button type="button" id="google" class="btn btn-ghost btn-block btn-google"><span class="g" aria-hidden="true">G</span><span data-i18n="auth.google">Continue with Google</span></button>
      <p class="divider"><span data-i18n="auth.or">or</span></p>
      <label class="field"><span data-i18n="auth.email">Email</span><input id="email" type="email" autocomplete="email" required /></label>
      <label class="field"><span data-i18n="auth.password">Password</span><input id="password" type="password" autocomplete="new-password" required minlength="6" /><small data-i18n="auth.passwordHint">At least 6 characters.</small></label>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.submitRegister">Create account</button>
    </form>
    <p id="auth-status" class="status" hidden></p>
    <p class="auth-links">
      <a href="/login" data-keep-next data-i18n="auth.toLogin">Have an account? Sign in</a>
    </p>
    <p class="fineprint" data-i18n="auth.shared">Accounts are shared with Collective Bucket apps.</p>
  </main>

  <script src="/assets/config.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/demographics.js" defer></script>
  <script src="/assets/lens-v2.js" defer></script>
  <script src="/assets/reading.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script type="module" src="/assets/auth.js"></script>
  <script src="/assets/store.js" defer></script>
  <script src="/assets/social.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/account.js" defer></script>
</body>
</html>
