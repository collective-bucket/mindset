<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eafbf5" />
  <title>create account · Mindset Bucket</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=mvcohe50" />
  <link rel="stylesheet" href="/assets/styles.css?v=mvcohe50" />
</head>
<body data-tab="" data-page="register" data-title="auth.registerTitle">
  <main class="page page-narrow">
    <div class="head">
      <a class="head-back" href="/" data-i18n-aria="common.back" aria-label="Back"><svg viewBox="0 0 8 16" aria-hidden="true"><path d="M7 1 1 8l6 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="head-main">
        <h1 data-i18n="auth.registerTitle">Create account</h1>
        <p class="head-meta" data-i18n="auth.registerLead">Take a number in the lake. An account lets you write a mindset and form a school.</p>
      </div>
    </div>
    <form id="auth-form" class="auth-form" novalidate>
      <p class="hint" data-i18n="auth.adultWhy">Schools and closed readings can get personal. Mindset Bucket is for people 18 and older.</p>
      <label class="check"><input id="adult" type="checkbox" required /> <span data-i18n="auth.adult">I am 18 or older.</span></label>
      <div id="register-fields" hidden>
        <button type="button" id="google" class="btn btn-ghost btn-block btn-google"><span class="g" aria-hidden="true">G</span><span data-i18n="auth.google">Continue with Google</span></button>
        <p class="landing-or" data-i18n="auth.or">or</p>
        <label class="field"><span data-i18n="auth.email">Email</span><input id="email" type="email" autocomplete="email" required /></label>
        <label class="field"><span data-i18n="auth.password">Password</span><input id="password" type="password" autocomplete="new-password" required minlength="6" /><small data-i18n="auth.passwordHint">At least 6 characters.</small></label>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.submitRegister">Create account</button>
      </div>
    </form>
    <p id="auth-status" class="status" hidden></p>
    <p class="auth-links">
      <a href="/login" data-keep-next data-i18n="auth.toLogin">Have an account? Sign in</a>
    </p>
  </main>

  <script src="/assets/config.js?v=mvcohe50" defer></script>
  <script src="/assets/i18n.js?v=mvcohe50" defer></script>
  <script src="/assets/demographics.js?v=mvcohe50" defer></script>
  <script src="/assets/lens-v2.js?v=mvcohe50" defer></script>
  <script src="/assets/reading.js?v=mvcohe50" defer></script>
  <script src="/assets/firestore.js?v=mvcohe50" defer></script>
  <script type="module" src="/assets/auth.js?v=mvcohe50"></script>
  <script src="/assets/store.js?v=mvcohe50" defer></script>
  <script src="/assets/social.js?v=mvcohe50" defer></script>
  <script src="/assets/ui.js?v=mvcohe50" defer></script>
  <script src="/assets/account.js?v=mvcohe50" defer></script>
</body>
</html>
